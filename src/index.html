<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Modern</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <div class="main">
  <header class="site-header">
  <h1 class="site-title"><a href="#/">Atlas Zwierząt Polski</a></h1>
    <nav class="page-nav">
      <ul class="inline-items">
        <li class="menu-item"><a href="#/">główna</a></li>
        <li class="menu-item"><a href="#/classes">gromady</a></li>
        <li class="menu-item active"><a href="#/site-index">skorowidz</a></li>
      </ul>
    </nav>
  </header>
  <app-root></app-root>
  <div class="bottom-nav-container">
    <ul class="bottom-nav inline-items inner" ng-controller="AnimalClassesCtrl">
      <li ng-repeat="(key, value) in classes">
        <h2>{{key}}</h2>
        <ul>
          <li class="label" ng-repeat="animal in value">
            <a href="#/animals/{{animal.id}}">{{animal.name}}</a>
          </li>
        </ul>
      </li>
    </ul>
  </div>
  </div>
  <footer class="site-footer">
    <div class="inner">
      <ul class="site-info inline-items">
        <li class="left">&copy; Atlas Zwierząt 2026 <a href="#/">Główna</a> · <a href="#/classes">Gromady</a> · <a href="#/site-index">Skorowidz</a></li> 
        <li class="right">Angular App: v<span app-version></span></li>
      </ul>
    </div>
  </footer>
</body>
</html>
