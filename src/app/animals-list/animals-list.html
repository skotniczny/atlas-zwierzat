<header class="site-header">
  <h1 class="site-title"><a routerLink="/">Atlas Zwierząt Polski</a></h1>

  <nav class="page-nav">
    <ul class="inline-items">
      <li class="menu-item active"><a routerLink="/">główna</a></li>
      <li class="menu-item"><a routerLink="/classes">gromady</a></li>
      <li class="menu-item"><a routerLink="/site-index">skorowidz</a></li>
      <li class="search">
        <input #s id="s" type="search" placeholder="Wyszukaj" [value]="query()" (input)="query.set(s.value)"> <label for="s"><i class="fa fa-search"></i></label>
      </li>
    </ul>
  </nav>
</header>

<div class="gallery clearfix">
@for (animal of filteredAnimals(); track animal.id) {
<dl>
  <dt>
    <a [routerLink]="['/animals', animal.id]">
      <img src="img/animals/{{animal.img}}" alt="{{animal.name}}">
    </a>
  </dt>
  <dd>
    <a [routerLink]="['/animals', animal.id]">{{animal.name}}</a>
  </dd>
</dl> 
}
</div>
