<header class="site-header">
  <h1 class="site-title"><a routerLink="/">Atlas Zwierząt Polski</a></h1>
  <app-page-nav>
    <li slot="search" class="search">
      <input #s id="s" type="search" placeholder="Wyszukaj" [value]="query()" (input)="query.set(s.value)"> <label for="s"><span class="sr-only">Wyszukaj zwierzę</span><i class="fa fa-search"></i></label>
    </li>
  </app-page-nav>
</header>

<div class="gallery">
  @for (animal of filteredAnimals(); track animal.id) {
    <app-animal-card [animal]="animal" />
  }
</div>
